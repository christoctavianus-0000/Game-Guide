<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Digimon Card Battle // Codex</title>
  <meta name="description" content="Interactive Digimon Digital Card Battle card database with full card attributes, filters, and search." />
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="styles.css" />
  <script>
    (function(){
      var K='digimon_codex_theme',V={dark:1,light:1},t=null;
      try{t=localStorage.getItem(K)}catch(e){}
      if(!t||!V[t]){try{var m=document.cookie.match('(?:^|;\s*)'+K+'=([^;]*)');t=m?decodeURIComponent(m[1]):null}catch(e){}}
      if(!t||!V[t]){try{var w=window.name;t=(w&&V[w])?w:null}catch(e){}}
      if(t==='light')document.documentElement.setAttribute('data-theme','light');
      else if(t==='dark')document.documentElement.setAttribute('data-theme','dark');
      else document.documentElement.removeAttribute('data-theme');
    })();
  </script>
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to main content</a>
  <div class="site-wrapper">
      <nav class="site-nav" aria-label="Codex sections">
        <div class="site-nav-inner">
          <a class="project-home-link" href="../index.html" aria-label="Back to the Game Guide home">← Project home</a>
          <span class="site-nav-brand"><img src="assets/ui/digivice.svg" alt="" class="nav-crest-icon" width="16" height="16" aria-hidden="true" /> DIGIMON CARD BATTLE CODEX</span>
          <div class="site-nav-links">
            <a class="site-nav-link active" href="index.html" aria-current="page"><img src="assets/ui/nav-cards.svg" alt="" class="nav-link-icon" width="16" height="16" aria-hidden="true" /> Card Codex</a>
            <a class="site-nav-link" href="fusion.html"><img src="assets/ui/nav-fusion.svg" alt="" class="nav-link-icon" width="16" height="16" aria-hidden="true" /> Fusion Codex</a>
          </div>
        </div>
      </nav>
      <aside class="site-rail" aria-label="Codex selector">
        <div class="site-rail-inner">
          <div class="site-rail-links">
            <a class="site-rail-link active" href="index.html" aria-current="page">
              <span class="site-rail-icon" aria-hidden="true"><img src="assets/ui/nav-cards.svg" alt="" width="24" height="24" /></span>
              <span class="site-rail-text">Cards</span>
            </a>
            <a class="site-rail-link" href="fusion.html">
              <span class="site-rail-icon" aria-hidden="true"><img src="assets/ui/nav-fusion.svg" alt="" width="24" height="24" /></span>
              <span class="site-rail-text">Fusion</span>
            </a>
          </div>
        </div>
      </aside>

      <!-- Header & Hero -->
    <header class="top-header">
      <div class="header-container">
        <div class="brand-area">
          <div class="brand-crest">
            <img src="assets/ui/digivice.svg" alt="" class="crest-icon-img" width="26" height="26" aria-hidden="true" />
          </div>
          <div>
            <div class="brand-kicker">DIGIMON CARD BATTLE // DIGITAL ARCHIVE</div>
            <h1 class="brand-title">Card Codex</h1>
          </div>
        </div>

        <!-- Database Metrics Bar -->
        <div class="metrics-bar" id="metricsBar">
          <div class="metric-pill total">
            <span class="metric-label">Total Cards</span>
            <span class="metric-val" id="metricTotal">301</span>
          </div>
          <div class="metric-pill physical">
            <span class="metric-label">Level U</span>
            <span class="metric-val" id="metricU">0</span>
          </div>
          <div class="metric-pill elemental">
            <span class="metric-label">Level C</span>
            <span class="metric-val" id="metricC">0</span>
          </div>
          <div class="metric-pill support">
            <span class="metric-label">Level R</span>
            <span class="metric-val" id="metricR">0</span>
          </div>
        </div>

        <div class="header-actions">
          <button class="theme-toggle-btn" id="theme-toggle-btn" type="button" aria-label="Switch to light theme" title="Toggle theme">
            <span class="theme-icon">🌙</span>
          </button>
        </div>
      </div>
    </header>

    <!-- Main Content -->
    <main id="main-content">
      <!-- Category Tabs -->
      <div class="category-tabs" id="categoryTabs">
        <button class="tab-btn active" data-category="all"><img src="assets/ui/spec-all.svg" alt="" class="tab-spec-icon" width="14" height="14" aria-hidden="true" /> All Cards <span class="tab-count">301</span></button>
        <button class="tab-btn" data-category="Fire"><img src="assets/ui/spec-fire.svg" alt="" class="tab-spec-icon" width="14" height="14" aria-hidden="true" /> Fire <span class="tab-count">34</span></button>
        <button class="tab-btn" data-category="Ice"><img src="assets/ui/spec-ice.svg" alt="" class="tab-spec-icon" width="14" height="14" aria-hidden="true" /> Ice <span class="tab-count">35</span></button>
        <button class="tab-btn" data-category="Nature"><img src="assets/ui/spec-nature.svg" alt="" class="tab-spec-icon" width="14" height="14" aria-hidden="true" /> Nature <span class="tab-count">34</span></button>
        <button class="tab-btn" data-category="Darkness"><img src="assets/ui/spec-darkness.svg" alt="" class="tab-spec-icon" width="14" height="14" aria-hidden="true" /> Darkness <span class="tab-count">36</span></button>
        <button class="tab-btn" data-category="Rare"><img src="assets/ui/spec-rare.svg" alt="" class="tab-spec-icon" width="14" height="14" aria-hidden="true" /> Rare <span class="tab-count">33</span></button>
        <button class="tab-btn" data-category="Partner"><img src="assets/ui/spec-partner.svg" alt="" class="tab-spec-icon" width="14" height="14" aria-hidden="true" /> Partner <span class="tab-count">19</span></button>
        <button class="tab-btn" data-category="Option"><img src="assets/ui/spec-option.svg" alt="" class="tab-spec-icon" width="14" height="14" aria-hidden="true" /> Option <span class="tab-count">110</span></button>
      </div>

      <!-- Search & Filter -->
      <div class="search-filter" id="searchFilter">
        <input type="text" id="cardSearch" placeholder="Search by name, card number, or support effect..." aria-label="Search cards" />
        <select id="levelFilter" aria-label="Filter by level">
          <option value="all">All Levels</option>
          <option value="U">Level U</option>
          <option value="C">Level C</option>
          <option value="R">Level R</option>
          <option value="A">Level A</option>
          <option value="R P">Level R P</option>
          <option value="Option">Option</option>
        </select>
      </div>
      <div class="mobile-sort-controls" aria-label="Mobile card sorting">
        <label for="cardSort">Sort by</label>
        <select id="cardSort">
          <option value="no">Card number</option>
          <option value="name">Name</option>
          <option value="level">Level</option>
          <option value="specialty">Specialty</option>
          <option value="hp">HP</option>
          <option value="dp">DP</option>
          <option value="plusP">+P</option>
          <option value="circle">Circle attack</option>
          <option value="triangle">Triangle attack</option>
          <option value="x">X attack</option>
          <option value="support">Support effect</option>
        </select>
        <button type="button" id="sortDirection" aria-label="Change sort direction">Ascending</button>
      </div>

      <!-- Card Table -->
      <section class="card-table-section" id="cardTableSection">
        <table class="card-table" id="cardTable">
          <thead>
            <tr>
              <th class="no-col sortable" data-sort="no" aria-sort="ascending"><button class="th-sort" data-sort-btn="no" type="button">No. <span class="sort-ind" aria-hidden="true">▲</span></button></th>
              <th class="icon-col">Icon</th>
              <th class="name-col sortable" data-sort="name"><button class="th-sort" data-sort-btn="name" type="button">Name <span class="sort-ind" aria-hidden="true"></span></button></th>
              <th class="level-col sortable" data-sort="level"><button class="th-sort" data-sort-btn="level" type="button">Level <span class="sort-ind" aria-hidden="true"></span></button></th>
              <th class="spec-col sortable" data-sort="specialty"><button class="th-sort" data-sort-btn="specialty" type="button">Specialty <span class="sort-ind" aria-hidden="true"></span></button></th>
              <th class="hp-col sortable" data-sort="hp"><button class="th-sort" data-sort-btn="hp" type="button">HP <span class="sort-ind" aria-hidden="true"></span></button></th>
              <th class="dp-col sortable" data-sort="dp"><button class="th-sort" data-sort-btn="dp" type="button">DP <span class="sort-ind" aria-hidden="true"></span></button></th>
              <th class="pp-col sortable" data-sort="plusP"><button class="th-sort" data-sort-btn="plusP" type="button">+P <span class="sort-ind" aria-hidden="true"></span></button></th>
              <th class="circle-col sortable" data-sort="circle"><button class="th-sort" data-sort-btn="circle" type="button"><img src="assets/ui/circle.svg" alt="[circle icon] attack" class="attack-type-icon" /> Attack <span class="sort-ind" aria-hidden="true"></span></button></th>
              <th class="triangle-col sortable" data-sort="triangle"><button class="th-sort" data-sort-btn="triangle" type="button"><img src="assets/ui/triangle.svg" alt="[triangle icon] attack" class="attack-type-icon" /> Attack <span class="sort-ind" aria-hidden="true"></span></button></th>
              <th class="x-col sortable" data-sort="x"><button class="th-sort" data-sort-btn="x" type="button"><img src="assets/ui/x.svg" alt="[x icon] attack" class="attack-type-icon" /> Attack <span class="sort-ind" aria-hidden="true"></span></button></th>
              <th class="support-col sortable" data-sort="support"><button class="th-sort" data-sort-btn="support" type="button">Support Effect <span class="sort-ind" aria-hidden="true"></span></button></th>
            </tr>
          </thead>
          <tbody id="cardTableBody">
            <!-- Cards rendered by JS -->
          </tbody>
        </table>
      </section>
    </main>
  </div>

  <!-- CARD DATABASE LOADED BY JS -->
  <script src="cardData.js"></script>
  <script src="themeToggle.js"></script>
  <script src="app.js"></script>
</body>
</html>
