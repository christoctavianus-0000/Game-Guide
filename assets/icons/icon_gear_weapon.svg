<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <!-- Weapon/Shield Combo -->
  <!-- Shield background -->
  <circle cx="12" cy="12" r="7" fill="#3A5FCD" stroke="#1E3A8A" stroke-width="1.5"/>
  <!-- Sword handle -->
  <rect x="10.5" y="8" width="3" height="4" fill="#8B7355" stroke="#654321" stroke-width="0.8"/>
  <!-- Sword blade -->
  <polygon points="12,12 15,18 9,18" fill="#C0C0C0" stroke="#A9A9A9" stroke-width="1.2"/>
  <!-- Shield rim -->
  <circle cx="12" cy="12" r="5" fill="none" stroke="#FFD700" stroke-width="1" opacity="0.6"/>
  <!-- Gemstones -->
  <circle cx="8" cy="12" r="1.2" fill="#FF1493"/>
  <circle cx="12" cy="8" r="1.2" fill="#00CED1"/>
  <circle cx="16" cy="12" r="1.2" fill="#32CD32"/>
</svg>