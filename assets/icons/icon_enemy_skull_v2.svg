<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" role="img" aria-label="Enemy Skull">
  <rect width="24" height="24" rx="3" fill="#0c0a12"/>
  <!-- Dark vignette -->
  <rect width="24" height="24" rx="3" fill="url(#skullVignette)" opacity="0.6"/>
  <defs><radialGradient id="skullVignette" cx="50%" cy="45%" r="60%"><stop offset="0%" stop-color="#2a1a3a" stop-opacity="0"/><stop offset="100%" stop-color="#050308" stop-opacity="0.8"/></radialGradient></defs>
  <!-- Skull cranium -->
  <path d="M12 4.2c-3.8 0-6.2 2.2-6.2 5.3 0 2 .7 3.3 1.8 4.2-.4.8-1.2 1.8-2.6 2.6v1.2c0 .5.4 1 1 1h10c.6 0 1-.5 1-1v-1.2c-1.4-.8-2.2-1.8-2.6-2.6 1.1-.9 1.8-2.2 1.8-4.2 0-3.1-2.4-5.3-6.2-5.3z" fill="#1a1520"/>
  <!-- Skull bone texture -->
  <path d="M12 4.2c-3.8 0-6.2 2.2-6.2 5.3 0 2 .7 3.3 1.8 4.2" fill="none" stroke="#2d2235" stroke-width="0.4"/>
  <path d="M9 5.5c.8-1.2 2-2 3-2s2.2.8 3 2" fill="none" stroke="#2d2235" stroke-width="0.3"/>
  <!-- Eye sockets - deep hollow -->
  <path d="M8.2 9.8c0-1.5 1-2.8 2.3-2.8.8 0 1.5.5 1.9 1.2l-1.2.5c-.2-.3-.5-.5-.8-.5-.7 0-1.2.7-1.2 1.6 0 .5.2 1 .5 1.3l-.5.7c-.6-.5-1-1.2-1-2z" fill="#050308"/>
  <path d="M15.8 9.8c0-1.5-1-2.8-2.3-2.8-.8 0-1.5.5-1.9 1.2l1.2.5c.2-.3.5-.5.8-.5.7 0 1.2.7 1.2 1.6 0 .5-.2 1-.5 1.3l.5.7c.6-.5 1-1.2 1-2z" fill="#050308"/>
  <!-- Faint red glow in sockets -->
  <circle cx="10" cy="10.2" r="0.6" fill="#4a0e0e" opacity="0.5"/>
  <circle cx="14" cy="10.2" r="0.6" fill="#4a0e0e" opacity="0.5"/>
  <!-- Nasal cavity -->
  <path d="M11.2 12.5l.8 1.2.8-1.2c.2-.3 0-.5-.2-.5h-1.2c-.2 0-.4.2-.2.5z" fill="#050308"/>
  <!-- Jaw line -->
  <path d="M7.5 15.5c.8 1.2 2 1.8 4.5 1.8s3.7-.6 4.5-1.8" fill="none" stroke="#1a1520" stroke-width="0.5"/>
  <!-- Cracked teeth -->
  <path d="M9.5 16v-1.8M10.5 16v-1.8M11.5 16v-1.5M12.5 16v-1.5M13.5 16v-1.8M14.5 16v-1.8" stroke="#0e0b14" stroke-width="0.5" stroke-linecap="round"/>
  <!-- Bone fracture lines -->
  <path d="M10 5.5l-.5 2.5M14 5.8l.8 2" stroke="#2d2235" stroke-width="0.25" stroke-linecap="round" opacity="0.6"/>
  <!-- Faint bone cracks -->
  <path d="M8 11.5l-1 2M16 11.5l1 2" stroke="#2d2235" stroke-width="0.2" opacity="0.4"/>
