  <polygon points="50,30 62,50 50,70 38,50" fill="url(#crestGrad)" opacity="0.8"/>
  <!-- Central Asterisk Core -->
  <circle cx="50" cy="50" r="5" fill="#ffffff" filter="url(#c-glow)"/>
</svg>